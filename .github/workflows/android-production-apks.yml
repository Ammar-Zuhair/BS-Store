name: Build Android production APKs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-production-apks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build all three apps
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            admin-app/package-lock.json
            customer-app/package-lock.json
            courier-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "Add the EXPO_TOKEN repository secret before running this workflow."
            exit 1
          fi

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build production APKs on this runner
        env:
          CI: '1'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          for app in admin-app customer-app courier-app; do
            echo "Building $app"
            (
              cd "$GITHUB_WORKSPACE/$app"
              trap 'rm -rf node_modules' EXIT
              npm ci --prefer-offline
              eas build \
                --platform android \
                --profile production \
                --local \
                --non-interactive \
                --output "$GITHUB_WORKSPACE/artifacts/$app.apk"
            )
          done

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-apks-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
